# nginx-tunneld.conf — Reverse proxy configuration for tunneld dashboard.
#
# Place in /etc/nginx/sites-available/tunneld.conf and symlink to
# /etc/nginx/sites-enabled/tunneld.conf, then reload Nginx:
#   systemctl reload nginx
#
# Replace tunnel.example.com with your actual public or internal hostname,
# and configure valid TLS certificates (e.g. Let's Encrypt with certbot).

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tunnel.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server terminating TLS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tunnel.example.com;

    # TLS Certificates (update paths to match your certificate provider)
    ssl_certificate /etc/letsencrypt/live/tunnel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnel.example.com/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (optional if tunneld sets it; Nginx can reinforce it)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # General proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Dashboard root and REST API
    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
    }

    # Live Event Stream (SSE) — MUST disable proxy buffering!
    location = /api/events {
        proxy_pass http://127.0.0.1:8095/api/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # Embedded Static Assets (CSS, JS, Fonts, SVG)
    location /static/ {
        proxy_pass http://127.0.0.1:8095/static/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_bypass 1;
        # Fonts are immutable and can be cached longer
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}
